name: Deploy smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Public deployment to smoke
        type: choice
        required: true
        default: production
        options: [production, workers-dev]
  schedule:
    - cron: '23 14 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

jobs:
  deploy-smoke:
    name: deploy-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check public deployment without provider calls
        env:
          SMOKE_TARGET: ${{ inputs.target || 'production' }}
        run: node scripts/ci/http-smoke.mjs --profile deployed --target "$SMOKE_TARGET"
